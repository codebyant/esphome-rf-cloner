# Reference configuration for the RF learning bridge, built from a clone of this repository.
#
# If you are installing RF Cloner rather than working on it, use config/rf-bridge-remote.yaml
# instead: it is the same configuration with the component and packages pulled from GitHub, so
# there is nothing to clone.
#
# Learn a command by name, store it on the device, and replay it later - no recompile per
# command. Requires ESPHome >= 2026.1 and the rf_cloner component in ../components.
#
# The control entities and Home Assistant actions come from ../packages; see
# docs/configuration.md. Wiring is in docs/hardware.md.

substitutions:
  name: rf-bridge

esphome:
  name: ${name}
  friendly_name: RF Bridge
  on_boot:
    # The radio must be listening once setup completes.
    priority: -100
    then:
      - cc1101.begin_rx: cc1101_radio

packages:
  rf_controls: !include
    file: ../packages/controls.yaml
    vars:
      rf_cloner_id: cloner
      # "true" keeps these controls on the device's web page and out of Home Assistant, for when
      # the Home Assistant integration provides the management UI instead.
      rf_hide_in_ha: "false"
  rf_actions: !include
    file: ../packages/api-actions.yaml
    vars:
      rf_cloner_id: cloner

external_components:
  - source:
      type: local
      path: ../components
    components: [rf_cloner]

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
      key: !secret api_key
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Renders the entities below as a local control page, so the bridge stays usable with Home
# Assistant offline.
web_server:
  port: 80

# Radio. Verify any change with config/hardware-check.yaml.

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  id: cc1101_radio
  cs_pin: GPIO5
  frequency: 433.92MHz
  modulation_type: ASK/OOK
  output_power: 10
  symbol_rate: 5000
  filter_bandwidth: 203kHz

# GDO2 -> receive
remote_receiver:
  id: rf_rx
  pin: GPIO4
  # Below the shortest pulse the target emits.
  filter: 100us
  # Above the target's inter-frame gap, so a window holds several repeats and rf_cloner can read
  # the gap from the waveform instead of inferring it. Must stay below the pause between separate
  # button presses, and below the 65536 us ceiling the ESP32's RMT imposes on `idle`.
  # Lowering this to frame each repeat separately still works, via a less precise fallback.
  idle: 30ms
  buffer_size: 10kB

# GDO0 -> transmit
remote_transmitter:
  id: rf_tx
  pin: GPIO22
  # Required for RF: the CC1101 handles modulation itself. rf_cloner rejects any other value
  # during config validation.
  carrier_duty_percent: 100%
  # A repeated replay occupies the air for most of a second; blocking would stall the main loop
  # for that whole time.
  non_blocking: true
  on_transmit:
    then:
      - cc1101.begin_tx: cc1101_radio
  on_complete:
    then:
      - cc1101.begin_rx: cc1101_radio

rf_cloner:
  id: cloner
  receiver_id: rf_rx
  transmitter_id: rf_tx
  max_commands: 16
  max_pulses: 128
  max_storage_bytes: 12288
  # Replay defaults, overridable per command.
  default_repeat_times: 20
  default_gap: 10ms
  on_learn_success:
    then:
      - logger.log:
          format: "Learned '%s'"
          args: ["x.c_str()"]
  on_learn_failed:
    then:
      - logger.log:
          level: WARN
          format: "Learn failed: %s"
          args: ["x.c_str()"]
