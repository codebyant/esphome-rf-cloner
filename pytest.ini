# pytest is used only by the Home Assistant suite in tests/ha. The other two suites are plain
# scripts - tests/run.sh compiles and runs the firmware tests, tests/run_python.sh runs the
# stubbed logic tests - because neither needs a test framework to say what it means.
#
# asyncio_mode is auto because that is what Home Assistant's own test helpers are written for:
# their fixtures are async and carry no explicit marker.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests/ha
