# Home Assistant API actions for an rf_cloner instance.
#
# Exposes learn, send, delete, cancel and list to automations and scripts, as
# `esphome.<node>_rf_learn` and so on. Independent of packages/controls.yaml: include either,
# both, or neither.
#
#   packages:
#     rf_actions: !include
#       file: packages/api-actions.yaml
#       vars:
#         rf_cloner_id: cloner
#
# Merges with an existing `api:` block, so a device's own actions are preserved.
#
# Requires an `rf_cloner:` component with a matching id.

defaults:
  rf_cloner_id: cloner
  # Prepended to every action name; change it when exposing two instances on one device.
  rf_action_prefix: rf_

api:
  actions:
    - action: ${rf_action_prefix}learn
      variables:
        name: string
      then:
        - rf_cloner.learn:
            id: ${rf_cloner_id}
            name: !lambda "return name;"

    - action: ${rf_action_prefix}send
      variables:
        name: string
      then:
        - rf_cloner.send:
            id: ${rf_cloner_id}
            name: !lambda "return name;"

    - action: ${rf_action_prefix}delete
      variables:
        name: string
      then:
        - rf_cloner.delete:
            id: ${rf_cloner_id}
            name: !lambda "return name;"

    - action: ${rf_action_prefix}cancel
      then:
        - rf_cloner.cancel: ${rf_cloner_id}

    # Drops every command but keeps the logical identity: the bridge_id and the id counter are
    # preserved, so a cleared bridge is still the same bridge and no id is ever handed out twice.
    - action: ${rf_action_prefix}clear
      then:
        - rf_cloner.clear_all: ${rf_cloner_id}

    # Discards the stored registry, including its bridge identity, and writes a fresh empty one.
    # Touches only this component's own preference records, never unrelated ESPHome state. This is
    # also the only mutation accepted when the device booted with storage it refuses to interpret.
    - action: ${rf_action_prefix}factory_reset
      then:
        - rf_cloner.factory_reset: ${rf_cloner_id}

    - action: ${rf_action_prefix}send_id
      variables:
        command_id: int
      then:
        - rf_cloner.send_id:
            id: ${rf_cloner_id}
            command_id: !lambda "return command_id;"

    # Names are mutable metadata, so a rename addresses the command by its immutable id and
    # leaves the waveform and that id untouched.
    - action: ${rf_action_prefix}rename
      variables:
        command_id: int
        name: string
      then:
        - rf_cloner.rename:
            id: ${rf_cloner_id}
            command_id: !lambda "return command_id;"
            name: !lambda "return name;"

    # Canonical read-only view of the registry, for a response_variable. Reports identity,
    # counters and one object per command; deliberately carries no waveforms, so it stays cheap
    # enough to poll and never doubles as a backup payload.
    - action: ${rf_action_prefix}status
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              const auto &registry = id(${rf_cloner_id}).store();
              root["bridge_id"] = registry.bridge_id_hex();
              root["revision"] = registry.revision();
              root["next_command_id"] = registry.next_command_id();
              root["restore_incomplete"] = registry.restore_incomplete();
              // Set when the device booted on storage it refuses to interpret; every mutation is
              // refused until rf_factory_reset.
              root["read_only"] = registry.read_only();
              root["fault"] = esphome::rf_cloner::store_fault_to_string(registry.fault());
              root["state"] = esphome::rf_cloner::learn_state_to_string(id(${rf_cloner_id}).state());
              root["last_result"] = id(${rf_cloner_id}).last_result();
              root["count"] = registry.count();
              root["max_commands"] = registry.max_commands();
              // Explains a too_many_pulses rejection without a second round trip.
              root["max_pulses"] = registry.max_pulses();
              root["used_bytes"] = registry.used_bytes();
              root["capacity_bytes"] = registry.capacity_bytes();
              JsonArray commands = root["commands"].to<JsonArray>();
              for (const auto &entry : registry.entries()) {
                JsonObject item = commands.add<JsonObject>();
                item["id"] = entry.command_id;
                item["name"] = entry.name;
                item["pulses"] = entry.pulse_count;
              }

    # Portable representation of one command: everything needed to reproduce it on another
    # bridge, and nothing else. `schema` versions this payload independently of the on-flash
    # format, so the two can evolve separately. `modulation` is the stored code (0 = OOK) rather
    # than a label, so an export round-trips exactly.
    - action: ${rf_action_prefix}export
      variables:
        command_id: int
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              const auto &registry = id(${rf_cloner_id}).store();
              esphome::rf_cloner::Command command;
              root["schema"] = 1;
              root["bridge_id"] = registry.bridge_id_hex();
              if (!registry.get_by_id(command_id, command)) {
                root["found"] = false;
                return;
              }
              root["found"] = true;
              root["command_id"] = command.command_id;
              root["name"] = command.name;
              root["pulses"] = command.timings.size();
              root["gap_us"] = command.gap_us;
              root["repeat_times"] = command.repeat_times;
              root["frequency_hz"] = command.frequency_hz;
              root["modulation"] = command.modulation;
              JsonArray timings = root["timings"].to<JsonArray>();
              for (int32_t value : command.timings) {
                timings.add(value);
              }

    # Restore is explicit and three-phase: adopt the identity, import each command under the id it
    # held, then commit. Until the commit lands, rf_status reports restore_incomplete and normal
    # mutations are refused, so an interrupted restore is visible rather than silently partial.
    - action: ${rf_action_prefix}restore_begin
      variables:
        bridge_id: string
        next_command_id: int
      then:
        - lambda: |-
            id(${rf_cloner_id}).restore_begin(bridge_id, next_command_id);

    - action: ${rf_action_prefix}import
      variables:
        command_id: int
        name: string
        timings: int[]
        gap_us: int
        repeat_times: int
        frequency_hz: int
        modulation: int
      then:
        - lambda: |-
            std::vector<int32_t> pulses(timings.begin(), timings.end());
            id(${rf_cloner_id}).import_command(command_id, name, pulses, gap_us, repeat_times, frequency_hz,
                                               modulation);

    - action: ${rf_action_prefix}restore_commit
      then:
        - lambda: |-
            id(${rf_cloner_id}).restore_commit();

    # Superseded by rf_status; kept for existing standalone scripts.
    - action: ${rf_action_prefix}list
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              JsonArray commands = root["commands"].to<JsonArray>();
              for (const auto &command_name : id(${rf_cloner_id}).store().names()) {
                commands.add(command_name);
              }
              root["count"] = id(${rf_cloner_id}).store().count();
              root["max_commands"] = id(${rf_cloner_id}).store().max_commands();
              root["used_bytes"] = id(${rf_cloner_id}).store().used_bytes();
              root["capacity_bytes"] = id(${rf_cloner_id}).store().capacity_bytes();
              root["state"] = esphome::rf_cloner::learn_state_to_string(id(${rf_cloner_id}).state());
              root["last_result"] = id(${rf_cloner_id}).last_result();
