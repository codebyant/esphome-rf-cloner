# Three suites, none of which needs radio hardware.
#
# The firmware tests need only a compiler, and the logic tests only a Python interpreter - they
# stub the handful of Home Assistant types the pure logic borrows. The Home Assistant suite is the
# expensive one: it installs Home Assistant, because what it checks is Home Assistant's own
# behaviour around config subentries, devices and the entity registry, which cannot be stubbed
# without the test becoming a test of the stub.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  firmware:
    name: Firmware (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the host tests
        run: sh tests/run.sh

  logic:
    name: Integration logic (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # The integration uses PEP 695 type aliases, so it needs 3.12 at the least. Home
          # Assistant 2026.8 itself runs on 3.13.
          python-version: "3.13"
      - name: Byte-compile the integration
        # Catches a syntax error anywhere in the component, including the modules the suites
        # below do not import.
        run: python -m compileall -q custom_components/rf_cloner components/rf_cloner
      - name: Run the host tests
        run: sh tests/run_python.sh

  home_assistant:
    name: Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Home Assistant 2026.8 onwards requires 3.14.2 at the least.
          python-version: "3.14"
      - name: Install Home Assistant
        # Pinned to the version the integration is developed and validated against. Home
        # Assistant's own test helpers only ship alongside a specific core version, so the two
        # are installed as a pair.
        run: pip install "homeassistant==2026.9.1" pytest-homeassistant-custom-component
      - name: Run the Home Assistant tests
        run: sh tests/run_ha.sh

  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: strings.json and translations/en.json must agree
        # en.json is the English translation of strings.json, so any key present in one and
        # missing from the other is an untranslated string waiting to surface in the UI.
        run: |
          python - <<'PY'
          import json, pathlib, sys

          root = pathlib.Path("custom_components/rf_cloner")


          def keys(value, prefix=""):
              if not isinstance(value, dict):
                  return {prefix}
              return {k for name, item in value.items() for k in keys(item, f"{prefix}.{name}")}


          source = keys(json.loads((root / "strings.json").read_text()))
          english = keys(json.loads((root / "translations/en.json").read_text()))
          if missing := source - english:
              print("Missing from translations/en.json:", *sorted(missing), sep="\n  ")
          if extra := english - source:
              print("Not in strings.json:", *sorted(extra), sep="\n  ")
          sys.exit(1 if missing or extra else 0)
          PY
